name: Elixir CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.16.1'
        otp-version: '26.2.1'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile code
      run: mix compile --warnings-as-errors

    - name: Run tests
      run: mix test --warnings-as-errors

    - name: Check formatting
      run: mix format --check-formatted

    - name: Run Credo
      run: mix credo

    # The PLT describes Elixir, Erlang and the dependencies, so it only has to
    # be rebuilt when one of those changes - building it takes minutes.
    - name: Cache Dialyzer PLT
      uses: actions/cache@v4
      with:
        path: priv/plts
        key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-plt-

    - name: Run Dialyzer
      run: mix dialyzer --format short
